# Goes in the repository at .github/workflows/imdb-ratings.yml
# Each day: download IMDb's two files, join them (build.mjs), publish the result as the only commit on the "data" branch.
name: IMDb ratings

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC; off the hour, when GitHub is busiest
  workflow_dispatch:        # adds a "Run workflow" button, for a run on demand

concurrency:
  group: csvtv-publish-data
  cancel-in-progress: false

permissions:
  contents: write           # lets the job push the result to this repository

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each action is pinned to the commit its tag named on 2026-11-14, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false  # git is not set up with the job token for the later steps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the repository is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          [[ "$visibility" == private ]] || { echo "A private repository is required."; exit 1; }
      - name: Download IMDb's files
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/csvtv-imdb-input"
          cd "$RUNNER_TEMP/csvtv-imdb-input"
          fetch_dataset() {
            curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-redirs 3 --max-filesize "$2" --connect-timeout 10 --max-time 90 --retry 2 \
              --retry-max-time 120 --remove-on-error --output "$1" "https://datasets.imdbws.com/$1"
          }
          fetch_dataset title.episode.tsv.gz 192M
          fetch_dataset title.ratings.tsv.gz 32M
      - name: Join them
        run: node build.mjs "$RUNNER_TEMP/csvtv-imdb-input" imdb-ratings.csv.gz
      - name: Publish a newer snapshot to data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          mv imdb-ratings.csv.gz out/
          cd out
          git init -q -b data
          git config credential.helper '!gh auth git-credential'
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          ref=refs/heads/data
          expected=
          existing=$(git ls-remote --refs "$remote" "$ref")
          if [[ -n "$existing" ]]; then
            git fetch -q --depth=1 "$remote" "$ref"
            expected=$(git rev-parse FETCH_HEAD)
            subject=$(git log -1 --format=%s FETCH_HEAD)
            # The raw commit retains its parent headers even in a depth-one fetch.
            parents=$(git cat-file -p FETCH_HEAD | sed -n '/^$/,$d; /^parent /p')
            files=$(git ls-tree --format='%(objectmode) %(objecttype) %(path)' FETCH_HEAD)
            [[ -z "$parents" && "$subject" =~ ^IMDb[[:space:]]ratings[[:space:]][0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$files" == '100644 blob imdb-ratings.csv.gz' ]] || {
              echo "Unrecognized output branch. Its contents have been preserved."
              exit 1
            }
            previous=$(git log -1 --format='%(trailers:key=csvTV-Run,valueonly)' FETCH_HEAD)
            if [[ -n "$previous" ]]; then
              [[ "$previous" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid snapshot generation."; exit 1; }
              # The trailer belongs to the existing branch and may exceed shell integer precision.
              if (( ${#previous} > ${#GITHUB_RUN_NUMBER} )) ||
                 { (( ${#previous} == ${#GITHUB_RUN_NUMBER} )) && [[ "$previous" == "$GITHUB_RUN_NUMBER" || "$previous" > "$GITHUB_RUN_NUMBER" ]]; }; then
                echo "An equal or newer run already published this snapshot."
                exit 0
              fi
            fi
          fi
          git add imdb-ratings.csv.gz
          git -c user.name="imdb-ratings-job" -c user.email="imdb-ratings-job@users.noreply.github.com" \
            commit -q -m "IMDb ratings $(date -u +%F)" -m "csvTV-Run: $GITHUB_RUN_NUMBER"
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          [[ "$visibility" == private ]] || { echo "Publication requires a private repository."; exit 1; }
          git push --force-with-lease="$ref:$expected" "$remote" "HEAD:$ref"
